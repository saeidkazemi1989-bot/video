name: Build ReelForge (APK + web)

# Builds the Android debug APK and the web (PWA) bundle on GitHub's runners.
# Trigger: manual (Actions ▸ Run workflow), any push, or a version tag (v1.2.3)
# which additionally publishes a GitHub Release with the APK attached.

on:
  workflow_dispatch:
    inputs:
      publish_apk_branch:
        description: 'آپلود APK در شاخهٔ apk-build (برای لینک دانلود بدون ورود به گیت‌هاب)'
        type: boolean
        default: false
  push:
    branches: [main, 'arena/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the runner image ships the Android SDK; keep everything non-interactive
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK info & platform install
        run: |
          set -x
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          ls -la "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          (yes | sdkmanager --licenses > /dev/null 2>&1) || true
          (sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1) || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          # Capacitor also reads this file
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "$ANDROID_HOME " >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        id: reltarget
        run: |
          mkdir -p out
          PKG_VER="$(node -p "require('./package.json').version")"
          cp android/app/build/outputs/apk/debug/*.apk "out/reelforge-v${PKG_VER}-${GITHUB_SHA::7}-debug.apk"
          ls -la out
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif ! git ls-remote --exit-code --tags origin "refs/tags/v${PKG_VER}" > /dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${PKG_VER}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=v${PKG_VER}" >> "$GITHUB_OUTPUT"
          fi

      # Keeps a plain, fetchable copy of the newest APK on the `apk-build` branch so the
      # file can be pulled over git/https without opening an authenticated release page.
      # Runs on every version tag, new package.json version, or via "publish_apk_branch".
      - name: Publish APK to the apk-build branch
        if: steps.reltarget.outputs.publish == 'true' || inputs.publish_apk_branch
        run: |
          set -euo pipefail
          apk="$(ls out/*.apk | head -1)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan apk-build
          git rm -rq --cached . > /dev/null 2>&1 || true
          cp "$apk" reelforge-latest.apk
          {
            echo "ریل‌فورج — آخرین APK ساخته‌شده"
            echo "ref:    ${{ steps.reltarget.outputs.tag }}"
            echo "commit: ${GITHUB_SHA}"
            echo "file:   reelforge-latest.apk"
            echo "size:   $(stat -c%s reelforge-latest.apk) bytes"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD.txt
          git add -f reelforge-latest.apk BUILD.txt
          git commit -q -m "build(apk): ${{ steps.reltarget.outputs.tag }} ${GITHUB_SHA::7} [skip ci]"
          git push -f origin apk-build

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p out
          {
            echo "== env =="; env | grep -i -E 'android|java|node|gradle' | sort
            echo; echo "== sdk =="; ls -la "$ANDROID_HOME" || true
            echo; echo "== platforms =="; ls "$ANDROID_HOME/platforms" || true
            echo; echo "== build-tools =="; ls "$ANDROID_HOME/build-tools" || true
            echo; echo "== apk =="; find android/app/build/outputs -name '*.apk' -exec ls -la {} \; 2>/dev/null || true
          } > out/diag.txt 2>&1
          cat out/diag.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reelforge-android-apk
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload web bundle (PWA)
        uses: actions/upload-artifact@v4
        with:
          name: reelforge-web-dist
          path: dist/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: out/diag.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: steps.reltarget.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltarget.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.reltarget.outputs.tag }}
          files: out/*.apk
          generate_release_notes: true
          body: |
            ریل‌فورج ${{ steps.reltarget.outputs.tag }} — نسخهٔ اندروید (با امضای ثابت؛ بدون نیاز به حذف نسخهٔ قبلی روی ۱٫۳٫۷ به بالا نصب می‌شود).

            تغییرات ۱٫۳٫۸:
            • حالت «پشت‌سرهم (بدون برش)»: ویدیوها بدون تکه‌شدن و دقیقاً به ترتیب خودت پشت‌سرهم می‌آیند و فقط در رفتن به ویدیوی بعدی ترنزیشن نرم می‌خورد.
            • تنظیم خودکار نور و روشنایی هر نما (Auto-Light) در کنار تنظیم قاب ۹:۱۶.
            • رفع دو بار اعمال‌شدن رنگ در لحظهٔ ترنزیشن بین دو نما.
