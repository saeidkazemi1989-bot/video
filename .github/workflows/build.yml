name: Build ReelForge (APK + web)

# Builds the Android debug APK and the web (PWA) bundle on GitHub's runners.
# Trigger: manual (Actions ▸ Run workflow), any push, or a version tag (v1.2.3)
# which additionally publishes a GitHub Release with the APK attached.

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the runner image ships the Android SDK; keep everything non-interactive
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK info & platform install
        run: |
          set -x
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          ls -la "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          (yes | sdkmanager --licenses > /dev/null 2>&1) || true
          (sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1) || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          # Capacitor also reads this file
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "$ANDROID_HOME " >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk "out/reelforge-${GITHUB_SHA::7}-debug.apk"
          ls -la out

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p out
          {
            echo "== env =="; env | grep -i -E 'android|java|node|gradle' | sort
            echo; echo "== sdk =="; ls -la "$ANDROID_HOME" || true
            echo; echo "== platforms =="; ls "$ANDROID_HOME/platforms" || true
            echo; echo "== build-tools =="; ls "$ANDROID_HOME/build-tools" || true
            echo; echo "== apk =="; find android/app/build/outputs -name '*.apk' -exec ls -la {} \; 2>/dev/null || true
          } > out/diag.txt 2>&1
          cat out/diag.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reelforge-android-apk
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload web bundle (PWA)
        uses: actions/upload-artifact@v4
        with:
          name: reelforge-web-dist
          path: dist/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: out/diag.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ریل‌فورج — نسخهٔ اندروید (APK تستی).

            نصب: فایل APK را روی گوشی باز کن و اجازهٔ «نصب از منابع ناشناس» را بده.
            برای ساخت iOS به macOS + Xcode نیاز است (به README مراجعه کن).
